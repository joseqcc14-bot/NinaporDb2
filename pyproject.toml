[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bodysim"
version = "0.1.0"
description = "Cuerpo humano paramétrico para simular fisiología y enfermedad: capa anatómica enlazada a UBERON, HRA y FMA."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bodysim = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
